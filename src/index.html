<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Image Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="slider-container">
      <div class="slider">
        <div class="slide"><img src="img/project-1.jpg" alt="Image 1" /></div>
        <div class="slide"><img src="img/project-2.jpg" alt="Image 2" /></div>
        <div class="slide"><img src="img/project-3.jpg" alt="Image 3" /></div>
        <div class="slide"><img src="img/project-4.jpg" alt="Image 4" /></div>
        <div class="slide"><img src="img/project-5.jpg" alt="Image 5" /></div>
        <div class="slide"><img src="img/project-1.jpg" alt="Image 6" /></div>
        <div class="slide"><img src="img/project-2.jpg" alt="Image 7" /></div>
        <div class="slide"><img src="img/project-3.jpg" alt="Image 8" /></div>
      </div>
      <div class="nav-buttons">
        <button id="upBtn">Up</button>
        <button id="downBtn">Down</button>
        <input type="number" id="slideInput" placeholder="Enter slide number" />
        <button id="goToSlideBtn">Go to Slide</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
